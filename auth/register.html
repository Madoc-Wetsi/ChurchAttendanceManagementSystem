<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — First Love Church</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body style="display:block">
  <div class="auth-wrap">
    <div class="auth-brand">
      <span class="mark">F</span>
      <h1>Join the team</h1>
      <p>Create an account to start recording attendance and managing members for First Love Church.</p>
      <div class="tag">Church Attendance Management System</div>
    </div>

    <div class="auth-side">
      <div class="auth-card">
        <h2>Create account</h2>
        <p class="sub">Set up your administrator login.</p>

        <form class="auth-form" id="register-form" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name">
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@church.org" autocomplete="email">
          </div>

          <div class="two">
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="At least 6 chars" autocomplete="new-password">
            </div>
            <div class="field">
              <label for="confirm">Confirm</label>
              <input type="password" id="confirm" name="confirm" placeholder="Repeat password" autocomplete="new-password">
            </div>
          </div>

          <div class="err" id="register-err" role="alert"></div>

          <button class="btn btn-primary" type="submit">Create account</button>
        </form>

        <p class="auth-alt">Already registered? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
